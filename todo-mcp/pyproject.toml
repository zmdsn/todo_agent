[project]
name = "todo-mcp"
version = "0.2.0"
description = "Personal plan management agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dateutil>=2.9.0.post0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "click>=8.0.0",
    "fastapi>=0.115.0",
]

[project.scripts]
todo-mcp = "todo_mcp.server:main"
todo-agent = "todo_mcp.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
